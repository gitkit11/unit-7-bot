name: UNIT-7 Replies

on:
  schedule:
    # every 2h across EU afternoon → US night; each slot acts ~60% of the time after a random
    # 0-50 min wait (see reply.py), so ~4-5 replies/day at irregular times, max 6/day
    - cron: '17 12-23/2 * * *'
    - cron: '17 0-2/2 * * *'
  workflow_dispatch:

permissions:
  contents: write  # commits replied.json (state + keeps the repo active so cron is never auto-disabled)

concurrency:
  group: unit7-replies
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests Pillow

      - name: Reply in one thread
        env:
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_REPLIES: '1'
        run: python reply.py

      - name: Save state
        run: |
          git config user.name "unit7-bot"
          git config user.email "unit7-bot@users.noreply.github.com"
          git add replied.json || true
          git diff --cached --quiet || (git commit -m "replies: update state" && git pull --rebase -q && git push)
